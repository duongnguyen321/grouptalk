services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: grouptalk
      POSTGRES_USER: grouptalk
      POSTGRES_PASSWORD: grouptalk
    ports:
      # Host port configurable via POSTGRES_PORT (default 25432 to avoid conflicts)
      - "127.0.0.1:${POSTGRES_PORT:-25432}:5432"
    volumes:
      - grouptalk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grouptalk -d grouptalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      # Host port configurable via REDIS_PORT (default 26379 to avoid conflicts)
      - "127.0.0.1:${REDIS_PORT:-26379}:6379"
    volumes:
      - grouptalk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grouptalk_pg_data:
  grouptalk_redis_data:
