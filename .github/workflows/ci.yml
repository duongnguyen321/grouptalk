name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/grouptalk
      REDIS_URL: redis://127.0.0.1:6380
      AUTH_SECRET: ci-dummy-secret-key-32-chars-long-example
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: https://grouptalk.t5edu.site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run ESLint
        run: bun run lint

      - name: Check TypeScript types
        run: bunx tsc --noEmit

      - name: Run test suite
        run: bun test

      - name: Verify production build
        run: bun run build
